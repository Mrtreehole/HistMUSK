[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "histmusk"
version = "0.1.0"
description = "Multimodal histology-to-spatial-expression prediction with image, cell, and text features"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "torch>=2.1,<3",
  "numpy>=1.26,<3",
  "pandas>=2.2,<3",
  "h5py>=3.10",
  "scipy>=1.11",
  "anndata>=0.11,<0.12",
  "zarr>=2.18,<3",
  "numcodecs>=0.12",
  "pyarrow>=15",
  "PyYAML>=6",
  "scikit-learn>=1.4",
  "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["histmusk*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
